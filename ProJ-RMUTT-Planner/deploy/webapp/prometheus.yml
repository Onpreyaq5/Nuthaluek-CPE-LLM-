# Prometheus ของ project rmutt-webapp — เหมือน infra/prometheus.yml แต่ไม่มี 09 (main_api)
# เพราะ project นี้ไม่ได้ยก 09 ขึ้น ถ้าใส่ไว้ target จะขึ้นว่าล่มตลอด
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: rmutt-services
    static_configs:
      - targets:
          - api_backend:8000
          - ai_router:8100
          - course_data:8400
          - data_integration:8500
          - schedule_engine:8600
          - rag_llm:8700
          - feedback:8800

  - job_name: infrastructure
    static_configs:
      - targets:
          - qdrant:6333
