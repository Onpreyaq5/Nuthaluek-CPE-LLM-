# RMUTT Study Planner — Docker Compose
#
#   docker compose up -d --build        ยกระบบที่ใช้งานได้จริงขึ้นทั้งหมด
#   เปิดเว็บที่ http://localhost:3000
#
# โปรไฟล์เสริม (ไม่ขึ้นโดยค่าตั้งต้น)
#   --profile monitoring    Prometheus + Grafana
#   --profile local-ai      โมเดลในเครื่องผ่าน Ollama
#   --profile vector        Qdrant
#
# หน้าเว็บมีสองตัว: main_app (09) ที่ :3000 เป็นตัวที่ใช้งานได้ครบ
# ส่วน web_app (01) ที่ :3001 เป็นหน้าเว็บที่คุยกับ api_backend (02) ตามสถาปัตยกรรมเต็ม

name: rmutt-planner

x-common-env: &common-env
  TZ: Asia/Bangkok
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  # ---------- 09 แอปที่ใช้งานได้จริง (หน้าเว็บ + ฟังก์ชัน Python) ----------
  # เป็นตัวที่ผู้ใช้เปิดใช้งานจริง รวมตรรกะตรวจตารางชนและ RAG ไว้ในตัว
  # จึงไม่ต้องรอให้โมดูล 01-08 เสร็จครบก่อนถึงจะมีของให้ดู
  main_app:
    build:
      context: ./09_main_app
      args:
        # ต้องส่งตอน build ไม่ใช่แค่ตอน runtime เพราะ Next ฝัง rewrite ลง build ไปแล้ว
        API_PROXY_URL: http://main_api:8009
    container_name: rmutt_main_app
    ports: ["3000:3000"]
    environment:
      <<: *common-env
      API_PROXY_URL: http://main_api:8009
    depends_on:
      main_api: {condition: service_healthy}
    networks: [rmutt-net]

  main_api:
    build:
      context: ./09_main_app
      dockerfile: Dockerfile.api
    container_name: rmutt_main_api
    environment:
      <<: *common-env
      HOST: 0.0.0.0
      PORT: "8009"
      # ใส่คีย์แล้วหน้าแชตจะเรียบเรียงคำตอบด้วย Gemini
      # ไม่ใส่ก็ใช้ได้ ระบบจะยกข้อความจากเอกสารมาตอบตรง ๆ แทน
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # main_app คุยผ่าน network ภายใน จึงไม่ต้องเปิด CORS ให้โดเมนภายนอก
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    networks: [rmutt-net]

  # ---------- 01 Frontend ----------
  web_app:
    build: ./01_web_app
    container_name: rmutt_web
    # 3000 ถูก main_app (09) ใช้อยู่ ตัวนี้จึงมาที่ 3001
    ports: ["3001:3000"]
    environment:
      <<: *common-env
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on: [api_backend]
    networks: [rmutt-net]

  # ---------- 02 API Gateway ----------
  api_backend:
    build: ./02_api_backend
    container_name: rmutt_api
    ports: ["8000:8000"]
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      AI_ROUTER_URL: http://ai_router:8100
      COURSE_DATA_URL: http://course_data:8400
      DATA_INTEGRATION_URL: http://data_integration:8500
      SCHEDULE_ENGINE_URL: http://schedule_engine:8600
      RAG_LLM_URL: http://rag_llm:8700
      FEEDBACK_URL: http://feedback:8800
      CORS_ORIGINS: http://localhost:3000
      # ── ชื่อ env ที่โมดูล 02 อ่านจริง (src/core/config.py) ──────────────
      # 02 ตั้งชื่อตามบทบาท ไม่ได้ตั้งตามชื่อ service ถ้าไม่ตั้งคู่นี้ 02 จะ fallback
      # ไปหา host ที่ไม่มีอยู่จริงใน compose (course_catalog, plan_engine, explainer ...)
      COURSE_CATALOG_URL: http://course_data:8400
      STUDENT_DATA_URL: http://data_integration:8500
      PLAN_ENGINE_URL: http://schedule_engine:8600
      EXPLAINER_URL: http://rag_llm:8700
      LOG_SINK_URL: http://feedback:8800
      # ── ต้องสั่งให้ 02 คุยกับโมดูลจริง ──────────────────────────────────
      # ค่าเริ่มต้นในโค้ดคือ "mock" ถ้าไม่ตั้ง ระบบจะขึ้นได้ครบแต่ 02 ตอบด้วยข้อมูลปลอม
      # และไม่เคยเรียกโมดูล 04-08 เลย (ดูเหมือนใช้งานได้ทั้งที่ยังไม่ได้ต่อกันจริง)
      ADAPTER_04: ${ADAPTER_04:-http}
      ADAPTER_05: ${ADAPTER_05:-http}
      ADAPTER_06: ${ADAPTER_06:-http}
      ADAPTER_07: ${ADAPTER_07:-http}
      ADAPTER_08: ${ADAPTER_08:-http}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    networks: [rmutt-net]

  # ---------- 03 AI Router / Agent ----------
  ai_router:
    build: ./03_ai_router_agent
    container_name: rmutt_ai_router
    ports: ["8100:8100"]
    environment:
      <<: *common-env
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LOCAL_MODEL_URL: http://local_ai:11434
      COURSE_DATA_URL: http://course_data:8400
      DATA_INTEGRATION_URL: http://data_integration:8500
      SCHEDULE_ENGINE_URL: http://schedule_engine:8600
      RAG_LLM_URL: http://rag_llm:8700
    networks: [rmutt-net]

  # ---------- 04 Course Data ----------
  course_data:
    build: ./04_course_data_services
    container_name: rmutt_course_data
    ports: ["8400:8400"]
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/1
      RAW_DATA_DIR: /data/raw
      ALLOW_SCRAPING: "false"
      SYNC_CRON: ${SYNC_CRON:-0 3 * * *}
    volumes:
      - ./data:/data
    depends_on:
      postgres: {condition: service_healthy}
    networks: [rmutt-net]

  # ---------- 05 Data Integration ----------
  data_integration:
    build: ./05_data_integration
    container_name: rmutt_data_integration
    ports: ["8500:8500"]
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SLOT_MINUTES: 30
      DAY_START: "08:00"
      DAY_END: "21:00"
    volumes:
      - ./data:/data
    depends_on:
      postgres: {condition: service_healthy}
    networks: [rmutt-net]

  # ---------- 06 Schedule & Conflict Engine (CORE) ----------
  schedule_engine:
    build: ./06_schedule_conflict_engine
    container_name: rmutt_schedule_engine
    ports: ["8600:8600"]
    environment:
      <<: *common-env
      DATA_INTEGRATION_URL: http://data_integration:8500
      REDIS_URL: redis://redis:6379/2
      MAX_SOLVER_SECONDS: 10
      MAX_PLAN_CANDIDATES: 5
      DEFAULT_MIN_CREDITS: 9
      DEFAULT_MAX_CREDITS: 21   # เพดานลงทะเบียนต่อเทอมปกติ มทร.ธัญบุรี
      SUMMER_MAX_CREDITS: 9     # เทอมฤดูร้อน — ยังไม่ยืนยัน
    networks: [rmutt-net]

  # ---------- 07 RAG + LLM ----------
  rag_llm:
    build: ./07_rag_llm_engine
    container_name: rmutt_rag_llm
    ports: ["8700:8700"]
    environment:
      <<: *common-env
      LLM_PROVIDER: ${LLM_PROVIDER:-rule_based}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      KNOWLEDGE_DIR: /app/data/knowledge
      SEED_DIR: /app/data/seed
      MIN_SCORE: ${MIN_SCORE:-0.21}
      DEFAULT_MIN_CREDITS: 9
      DEFAULT_MAX_CREDITS: 21
      SUMMER_MAX_CREDITS: 9
    networks: [rmutt-net]

  # ---------- 08 Recommendation / Feedback / Monitoring ----------
  feedback:
    build: ./08_recommendation_feedback
    container_name: rmutt_feedback
    ports: ["8800:8800"]
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/3
      # ถ้าไม่ตั้ง endpoint ฝั่งแอดมินของ 08 จะตอบ 503 INTERNAL_AUTH_UNCONFIGURED ทุกครั้ง
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [rmutt-net]

  # ---------- Infrastructure ----------
  postgres:
    image: postgres:16-alpine
    container_name: rmutt_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Bangkok
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [rmutt-net]

  redis:
    image: redis:7-alpine
    container_name: rmutt_redis
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    networks: [rmutt-net]

  # ยังไม่มีใครใช้: โมดูล 07 ค้นแบบ in-memory (BM25 + TF-IDF) จึงไม่ต้องมี vector DB
  # เปิดเมื่อคลังความรู้โตจนต้องใช้ embedding จริง: docker compose --profile vector up -d
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rmutt_qdrant
    profiles: [vector]
    ports: ["6333:6333"]
    volumes: [qdrantdata:/qdrant/storage]
    networks: [rmutt-net]

  # ---------- Optional: โมเดลในเครื่อง ----------
  local_ai:
    image: ollama/ollama:latest
    container_name: rmutt_local_ai
    profiles: [local-ai]
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    networks: [rmutt-net]

  # ---------- Optional: Monitoring ----------
  prometheus:
    image: prom/prometheus:latest
    container_name: rmutt_prometheus
    profiles: [monitoring]
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [rmutt-net]

  grafana:
    image: grafana/grafana:latest
    container_name: rmutt_grafana
    profiles: [monitoring]
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes: [grafanadata:/var/lib/grafana]
    networks: [rmutt-net]

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  ollama:
  grafanadata:

networks:
  rmutt-net:
    driver: bridge
