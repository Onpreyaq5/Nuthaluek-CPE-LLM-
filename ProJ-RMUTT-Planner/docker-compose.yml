# RMUTT Study Planner — Docker Compose
#
#   docker compose up -d --build        ยกระบบที่ใช้งานได้จริงขึ้นทั้งหมด
#   เปิดเว็บที่ http://localhost:3000
#
# ขึ้นครบตามแผนภาพสถาปัตยกรรม: หน้าเว็บ, API, AI Router, บริการข้อมูล,
# เครื่องมือจัดตาราง, RAG, ระบบเก็บสถิติ, ฐานข้อมูล, Vector DB และ Monitoring
#
# Local AI Model (Ollama) ขึ้นโดยค่าตั้งต้นและดึงโมเดลเองครั้งแรก (~400 MB)
#
# หน้าเว็บมีสองตัว: main_app (09) ที่ :3000 เป็นตัวที่ใช้งานได้ครบ
# ส่วน web_app (01) ที่ :3001 เป็นหน้าเว็บที่คุยกับ api_backend (02) ตามสถาปัตยกรรมเต็ม

name: rmutt-planner

x-common-env: &common-env
  TZ: Asia/Bangkok
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  # ---------- 09 แอปที่ใช้งานได้จริง (หน้าเว็บ + ฟังก์ชัน Python) ----------
  # เป็นตัวที่ผู้ใช้เปิดใช้งานจริง รวมตรรกะตรวจตารางชนและ RAG ไว้ในตัว
  # จึงไม่ต้องรอให้โมดูล 01-08 เสร็จครบก่อนถึงจะมีของให้ดู
  main_app:
    build:
      context: ./09_main_app
      args:
        # ต้องส่งตอน build ไม่ใช่แค่ตอน runtime เพราะ Next ฝัง rewrite ลง build ไปแล้ว
        API_PROXY_URL: http://main_api:8009
    container_name: rmutt_main_app
    ports: ["3000:3000"]
    environment:
      <<: *common-env
      API_PROXY_URL: http://main_api:8009
    depends_on:
      main_api: {condition: service_healthy}
    networks: [rmutt-net]

  main_api:
    build:
      context: ./09_main_app
      dockerfile: Dockerfile.api
    container_name: rmutt_main_api
    environment:
      <<: *common-env
      HOST: 0.0.0.0
      PORT: "8009"
      # ใส่คีย์แล้วหน้าแชตจะเรียบเรียงคำตอบด้วย Gemini
      # ไม่ใส่ก็ใช้ได้ ระบบจะยกข้อความจากเอกสารมาตอบตรง ๆ แทน
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # main_app คุยผ่าน network ภายใน จึงไม่ต้องเปิด CORS ให้โดเมนภายนอก
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    networks: [rmutt-net]

  # ---------- 01 Frontend ----------
  web_app:
    build:
      context: ./01_web_app
      args:
        # Vite ฝังค่านี้ตอน build ตั้งตอน runtime ไม่มีผล
        # false = เรียก API จริงผ่าน nginx, true = ใช้ข้อมูลจำลองในเบราว์เซอร์
        VITE_USE_MOCKS: "false"
    container_name: rmutt_web
    # 01 เป็น Vite + nginx ซึ่ง nginx ฟังที่พอร์ต 80 ไม่ใช่ 3000
    # ก่อนหน้านี้ map 3001:3000 ทำให้เปิดไม่ได้เลย (connection refused)
    # 3000 ฝั่ง host เป็นของ main_app (09) ตัวนี้จึงมาที่ 3001
    ports: ["3001:80"]
    environment:
      <<: *common-env
      # nginx ใช้ตัวนี้ proxy /api/ ไปที่ 02
      # ค่าตั้งต้นในภาพคือ 127.0.0.1:8000 ซึ่งชี้กลับมาที่ตัวเอง = proxy ไม่ติด
      API_UPSTREAM: http://api_backend:8000
    depends_on: [api_backend]
    networks: [rmutt-net]

  # ---------- 02 API Gateway ----------
  api_backend:
    build: ./02_api_backend
    container_name: rmutt_api
    ports: ["8000:8000"]
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      AI_ROUTER_URL: http://ai_router:8100
      COURSE_DATA_URL: http://course_data:8400
      DATA_INTEGRATION_URL: http://data_integration:8500
      SCHEDULE_ENGINE_URL: http://schedule_engine:8600
      RAG_LLM_URL: http://rag_llm:8700
      FEEDBACK_URL: http://feedback:8800
      CORS_ORIGINS: http://localhost:3000
      # ── ชื่อ env ที่โมดูล 02 อ่านจริง (src/core/config.py) ──────────────
      # 02 ตั้งชื่อตามบทบาท ไม่ได้ตั้งตามชื่อ service ถ้าไม่ตั้งคู่นี้ 02 จะ fallback
      # ไปหา host ที่ไม่มีอยู่จริงใน compose (course_catalog, plan_engine, explainer ...)
      COURSE_CATALOG_URL: http://course_data:8400
      STUDENT_DATA_URL: http://data_integration:8500
      PLAN_ENGINE_URL: http://schedule_engine:8600
      EXPLAINER_URL: http://rag_llm:8700
      LOG_SINK_URL: http://feedback:8800
      # ── ต้องสั่งให้ 02 คุยกับโมดูลจริง ──────────────────────────────────
      # ค่าเริ่มต้นในโค้ดคือ "mock" ถ้าไม่ตั้ง ระบบจะขึ้นได้ครบแต่ 02 ตอบด้วยข้อมูลปลอม
      # และไม่เคยเรียกโมดูล 04-08 เลย (ดูเหมือนใช้งานได้ทั้งที่ยังไม่ได้ต่อกันจริง)
      ADAPTER_04: ${ADAPTER_04:-http}
      ADAPTER_05: ${ADAPTER_05:-http}
      ADAPTER_06: ${ADAPTER_06:-http}
      ADAPTER_07: ${ADAPTER_07:-http}
      ADAPTER_08: ${ADAPTER_08:-http}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      # สร้างบัญชีเดโมตอนเริ่ม (admin / admin1234) ถ้าไม่ตั้ง หน้าเว็บ 01 จะ login ไม่ได้เลย
      # เพราะตาราง students ว่าง — ใช้เพื่อสาธิตเท่านั้น ห้ามเปิดแบบนี้บนเครื่องที่ออกอินเทอร์เน็ต
      SEED_DEMO: ${SEED_DEMO:-true}
      # 02 เรียก 07 สร้างคำตอบแบบรอทีเดียว ระหว่างรอไม่มี event ไหลออกไป
      # ถ้าตอบด้วยโมเดลในเครื่อง (CPU) อาจใช้เกิน 30 วินาทีที่เป็นค่าตั้งต้น
      TIMEOUT_CHAT_IDLE_SECONDS: ${TIMEOUT_CHAT_IDLE_SECONDS:-120}
      TIMEOUT_CHAT_TOTAL_SECONDS: ${TIMEOUT_CHAT_TOTAL_SECONDS:-180}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    networks: [rmutt-net]

  # ---------- 03 AI Router / Agent ----------
  ai_router:
    build: ./03_ai_router_agent
    container_name: rmutt_ai_router
    ports: ["8100:8100"]
    environment:
      <<: *common-env
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # ใส่คีย์ที่ GEMINI_API_KEY ใน .env ที่เดียว ใช้ได้ทั้ง 03, 07 และ 09
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-flash-lite-latest}
      # กล่อง Local AI Model ในแผนภาพ — จัดประเภทคำถามตอน keyword ไม่มั่นใจ
      LOCAL_MODEL_URL: http://local_ai:11434
      LOCAL_MODEL: ${LOCAL_MODEL:-qwen2.5:0.5b}
      COURSE_DATA_URL: http://course_data:8400
      DATA_INTEGRATION_URL: http://data_integration:8500
      SCHEDULE_ENGINE_URL: http://schedule_engine:8600
      RAG_LLM_URL: http://rag_llm:8700
    networks: [rmutt-net]

  # ---------- 04 Course Data ----------
  course_data:
    build: ./04_course_data_services
    container_name: rmutt_course_data
    ports: ["8400:8400"]
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/1
      RAW_DATA_DIR: /data/raw
      ALLOW_SCRAPING: "false"
      SYNC_CRON: ${SYNC_CRON:-0 3 * * *}
      # ตารางสอนจริงชุดเดียวกับที่ 07 และ 09 ใช้ ถ้าไม่ตั้ง 04 จะใช้ข้อมูลตัวอย่าง 2 วิชา
      # แล้ว 06 จะหากลุ่มเรียนที่ 02 ส่งมาไม่เจอ ตรวจตารางชนพังทุกครั้ง
      SEED_DIR: /data/seed
    volumes:
      - ./data:/data
      - ./09_main_app/data/seed:/data/seed:ro
    depends_on:
      postgres: {condition: service_healthy}
    networks: [rmutt-net]

  # ---------- 05 Data Integration ----------
  data_integration:
    build: ./05_data_integration
    container_name: rmutt_data_integration
    ports: ["8500:8500"]
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SLOT_MINUTES: 30
      DAY_START: "08:00"
      DAY_END: "21:00"
    volumes:
      - ./data:/data
    depends_on:
      postgres: {condition: service_healthy}
    networks: [rmutt-net]

  # ---------- 06 Schedule & Conflict Engine (CORE) ----------
  schedule_engine:
    build: ./06_schedule_conflict_engine
    container_name: rmutt_schedule_engine
    ports: ["8600:8600"]
    environment:
      <<: *common-env
      # ขาดตัวนี้ 06 จะเรียก 04 ไม่ติด เพราะค่าตั้งต้นในโค้ดชี้ไป host ที่ไม่มีใน compose
      # และจะรู้ตัวก็ต่อเมื่อรันจริงแล้วลองยิงเท่านั้น build ผ่านปกติ
      COURSE_DATA_URL: http://course_data:8400
      DATA_INTEGRATION_URL: http://data_integration:8500
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      HTTP_TIMEOUT_SECONDS: "10"
      REDIS_URL: redis://redis:6379/2
      MAX_SOLVER_SECONDS: 10
      MAX_PLAN_CANDIDATES: 5
      DEFAULT_MIN_CREDITS: 9
      DEFAULT_MAX_CREDITS: 21   # เพดานลงทะเบียนต่อเทอมปกติ มทร.ธัญบุรี
      SUMMER_MAX_CREDITS: 9     # เทอมฤดูร้อน — ยังไม่ยืนยัน
    networks: [rmutt-net]

  # ---------- 07 RAG + LLM ----------
  rag_llm:
    build: ./07_rag_llm_engine
    container_name: rmutt_rag_llm
    ports: ["8700:8700"]
    environment:
      <<: *common-env
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-flash-lite-latest}
      # กล่อง Vector DB ในแผนภาพ — เวกเตอร์ TF-IDF เก็บและค้นใน Qdrant
      # Qdrant ล่ม = ค้นในหน่วยความจำแทนอัตโนมัติ ผลเท่ากันทุกตำแหน่ง
      QDRANT_URL: http://qdrant:6333
      # กล่อง Local AI Model — ตอบคำถามทั่วไปเมื่อไม่มีคีย์ Gemini
      LOCAL_MODEL_URL: http://local_ai:11434
      LOCAL_MODEL: ${LOCAL_MODEL:-qwen2.5:0.5b}
      LOCAL_LLM_TIMEOUT: "110"
      KNOWLEDGE_DIR: /app/data/knowledge
      SEED_DIR: /app/data/seed
      # 07 เรียก 05 และ 06 ต่อ ระบุให้ชัดแทนการพึ่งค่าตั้งต้นในโค้ด
      DATA_INTEGRATION_URL: http://data_integration:8500
      SCHEDULE_ENGINE_URL: http://schedule_engine:8600
      MIN_SCORE: ${MIN_SCORE:-0.21}
      DEFAULT_MIN_CREDITS: 9
      DEFAULT_MAX_CREDITS: 21
      SUMMER_MAX_CREDITS: 9
    networks: [rmutt-net]

  # ---------- 08 Recommendation / Feedback / Monitoring ----------
  feedback:
    build: ./08_recommendation_feedback
    container_name: rmutt_feedback
    ports: ["8800:8800"]
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/3
      # ถ้าไม่ตั้ง endpoint ฝั่งแอดมินของ 08 จะตอบ 503 INTERNAL_AUTH_UNCONFIGURED ทุกครั้ง
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [rmutt-net]

  # ---------- Infrastructure ----------
  postgres:
    image: postgres:16-alpine
    container_name: rmutt_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Bangkok
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [rmutt-net]

  redis:
    image: redis:7-alpine
    container_name: rmutt_redis
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    networks: [rmutt-net]

  # ช่อง Vector DB ในแผนภาพ (Retrieval / Knowledge)
  # 07 อัปโหลดเวกเตอร์ของทั้ง 69 ส่วนเอกสารขึ้นมาตอนเริ่ม แล้วค้นขาเวกเตอร์ที่นี่
  # ดู collection ได้ที่ http://localhost:6333/dashboard
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rmutt_qdrant
    ports: ["6333:6333"]
    volumes: [qdrantdata:/qdrant/storage]
    networks: [rmutt-net]

  # ---------- Local AI Model (กล่อง 4 ในแผนภาพ) ----------
  # Ollama รันโมเดลในเครื่อง ไม่ต้องมีคีย์ ไม่ส่งข้อมูลออกนอกเครื่อง
  # qwen2.5:0.5b ขนาด ~400 MB อ่านไทยได้ รันบน CPU ได้ ไม่ต้องมี GPU
  # เปลี่ยนโมเดลได้ที่ LOCAL_MODEL ใน .env
  local_ai:
    image: ollama/ollama:latest
    container_name: rmutt_local_ai
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    environment:
      # เก็บโมเดลไว้ในหน่วยความจำ ไม่งั้นทุกคำถามต้องโหลดใหม่ ช้ามากบน CPU
      OLLAMA_KEEP_ALIVE: 24h
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [rmutt-net]

  # ดึงโมเดลครั้งเดียวแล้วจบ (ครั้งถัดไปมีใน volume แล้ว ใช้เวลาไม่ถึงวินาที)
  local_ai_pull:
    image: ollama/ollama:latest
    container_name: rmutt_local_ai_pull
    entrypoint: ["ollama", "pull", "${LOCAL_MODEL:-qwen2.5:0.5b}"]
    environment:
      OLLAMA_HOST: http://local_ai:11434
    depends_on:
      local_ai: {condition: service_healthy}
    restart: "no"
    networks: [rmutt-net]

  # ---------- Optional: Monitoring ----------
  # ช่อง Monitoring & Analytics ในแผนภาพ
  prometheus:
    image: prom/prometheus:latest
    container_name: rmutt_prometheus
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [rmutt-net]

  grafana:
    image: grafana/grafana:latest
    container_name: rmutt_grafana
    # 3001 เป็นของ web_app (01) แล้ว ย้ายมา 3002 ไม่งั้นพอร์ตชนกันตอนขึ้นพร้อมกัน
    ports: ["3002:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # เปิดดู dashboard ได้โดยไม่ต้อง login (อ่านอย่างเดียว) — แก้ไขยังต้อง login admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rmutt-overview.json
    volumes:
      - grafanadata:/var/lib/grafana
      # ต่อ Prometheus และสร้าง dashboard ให้ตั้งแต่ขึ้นครั้งแรก ไม่ต้องกดตั้งค่าเอง
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    networks: [rmutt-net]

  # ---------- ลิงก์สาธารณะ (ไม่ขึ้นโดยค่าตั้งต้น) ----------
  # Cloudflare Quick Tunnel: ได้ลิงก์ https://xxxx.trycloudflare.com ฟรี ไม่ต้องสมัคร
  # ลิงก์ใช้ได้เฉพาะตอนเครื่องนี้เปิดอยู่ และเปลี่ยนใหม่ทุกครั้งที่สั่งขึ้น
  #
  #   docker compose --profile public up -d
  #   docker compose logs tunnel_main tunnel_web tunnel_grafana | grep trycloudflare
  #
  # ก่อนเปิดต้องเปลี่ยนรหัส admin ของ Grafana และปิด SEED_DEMO ถ้าไม่ได้ตั้งใจให้คนนอก login ได้
  tunnel_main:
    image: cloudflare/cloudflared:latest
    container_name: rmutt_tunnel_main
    profiles: [public]
    command: tunnel --no-autoupdate --url http://main_app:3000
    depends_on: [main_app]
    networks: [rmutt-net]

  tunnel_web:
    image: cloudflare/cloudflared:latest
    container_name: rmutt_tunnel_web
    profiles: [public]
    command: tunnel --no-autoupdate --url http://web_app:80
    depends_on: [web_app]
    networks: [rmutt-net]

  tunnel_grafana:
    image: cloudflare/cloudflared:latest
    container_name: rmutt_tunnel_grafana
    profiles: [public]
    command: tunnel --no-autoupdate --url http://grafana:3000
    depends_on: [grafana]
    networks: [rmutt-net]

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  ollama:
  grafanadata:

networks:
  rmutt-net:
    driver: bridge
